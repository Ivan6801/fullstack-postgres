version: "3.3"

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=my_store
      - POSTGRES_USER=ivan
      - POSTGRES_PASSWORD=admin123
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@mail.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - 5050:80

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_USER=ivan
      - DB_PASSWORD=admin123
      - DB_NAME=my_store
      - DB_PORT=5432
    ports:
      - 3001:3001
    depends_on:
      - postgres
